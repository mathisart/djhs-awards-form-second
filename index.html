<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校園榮譽頒獎文件系統 v2.3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
          }
        }
      }
    }
  </script>
  <style>
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

  <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
    
    <header class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-school text-brand-600"></i>
          校園榮譽頒獎系統 <span class="text-xs bg-brand-100 text-brand-700 px-2 py-1 rounded-full">v2.3</span>
        </h1>
        <p class="text-slate-500 text-sm mt-1">自動化產生司儀稿與獎懲建議單</p>
      </div>
      
      <div id="statusBadge" class="inline-flex items-center gap-2 px-4 py-2 bg-slate-200 rounded-full text-sm font-medium text-slate-600 transition-colors cursor-pointer select-none">
        <i class="fa-solid fa-circle-notch fa-spin"></i> 連線檢查中...
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <div class="lg:col-span-4 space-y-6">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 sticky top-4">
          <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2 flex items-center gap-2">
            <i class="fa-solid fa-user-pen text-brand-500"></i> 新增名單
          </h2>

          <div class="space-y-4">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">班級</label>
                <input id="inClass" type="text" placeholder="701" class="w-full rounded-lg border-slate-300 focus:border-brand-500 focus:ring-brand-500 transition-colors p-2.5 bg-slate-50 text-center text-lg font-bold">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">座號</label>
                <input id="inSeat" type="text" placeholder="01" class="w-full rounded-lg border-slate-300 focus:border-brand-500 focus:ring-brand-500 transition-colors p-2.5 bg-slate-50 text-center text-lg font-bold">
              </div>
            </div>

            <div class="relative">
              <label class="block text-xs font-semibold text-slate-500 mb-1">姓名</label>
              <input id="inName" type="text" placeholder="自動查詢..." class="w-full rounded-lg border-slate-300 focus:border-brand-500 focus:ring-brand-500 p-2.5">
              <div id="nameLoading" class="absolute right-3 top-8 hidden text-slate-400"><i class="fa-solid fa-spinner fa-spin"></i></div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">發生日期</label>
              <input id="inDate" type="date" class="w-full rounded-lg border-slate-300 focus:border-brand-500 focus:ring-brand-500 p-2.5 text-slate-600">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">事由 (比賽名稱)</label>
              <textarea id="inReason" rows="2" placeholder="例如：校內英語朗讀比賽" class="w-full rounded-lg border-slate-300 focus:border-brand-500 focus:ring-brand-500 p-2.5"></textarea>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">成績 (名次/等第)</label>
              <input id="inRank" type="text" placeholder="例如：第一名、特優" class="w-full rounded-lg border-slate-300 focus:border-brand-500 focus:ring-brand-500 p-2.5">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">建議敘獎</label>
              <select id="inReward" class="w-full rounded-lg border-slate-300 focus:border-brand-500 focus:ring-brand-500 p-2.5">
                <option value="">(無)</option>
                <option value="嘉獎一支">嘉獎一支</option>
                <option value="嘉獎二支">嘉獎二支</option>
                <option value="小功一支">小功一支</option>
                <option value="小功二支">小功二支</option>
              </select>
            </div>

            <button id="btnAdd" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-lg shadow transition-transform active:scale-95 flex items-center justify-center gap-2 mt-2">
              <i class="fa-solid fa-plus"></i> 加入清單
            </button>
          </div>
        </div>
      </div>

      <div class="lg:col-span-8 space-y-4">
        
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-3 items-center justify-between">
          <div class="flex gap-2">
            <button onclick="UI.openHistory()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-medium transition-colors flex items-center gap-2">
              <i class="fa-solid fa-clock-rotate-left"></i> <span class="hidden sm:inline">歷史紀錄</span>
            </button>
            <button id="btnClear" class="px-4 py-2 text-rose-600 hover:bg-rose-50 rounded-lg font-medium transition-colors">
              <i class="fa-regular fa-trash-can"></i> 清空
            </button>
          </div>
          <div class="flex gap-2 w-full sm:w-auto">
            <button id="btnEmcee" class="flex-1 sm:flex-none px-4 py-2 bg-violet-600 hover:bg-violet-700 text-white rounded-lg font-medium shadow-sm transition-colors flex items-center justify-center gap-2">
              <i class="fa-solid fa-microphone-lines"></i> 司儀稿
            </button>
            <button id="btnAward" class="flex-1 sm:flex-none px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-medium shadow-sm transition-colors flex items-center justify-center gap-2">
              <i class="fa-solid fa-file-signature"></i> 敘獎單
            </button>
          </div>
        </div>

        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
          <input id="q" type="text" placeholder="搜尋班級、姓名或事由..." class="w-full pl-10 pr-4 py-2.5 rounded-lg border-slate-200 border shadow-sm focus:border-brand-500 focus:ring-brand-500">
        </div>

        <div class="hidden md:block bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="overflow-x-auto max-h-[600px] custom-scroll">
            <table class="w-full text-sm text-left text-slate-600">
              <thead class="text-xs text-slate-700 uppercase bg-slate-50 sticky top-0 border-b z-10">
                <tr>
                  <th class="px-4 py-3 w-10 text-center"><input type="checkbox" id="checkAll" class="rounded"></th>
                  <th class="px-4 py-3">班級/座號</th>
                  <th class="px-4 py-3">姓名</th>
                  <th class="px-4 py-3">事由</th>
                  <th class="px-4 py-3">成績</th>
                  <th class="px-4 py-3">操作</th>
                </tr>
              </thead>
              <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>
          <div id="emptyState" class="hidden py-12 flex flex-col items-center justify-center text-slate-400">
            <i class="fa-regular fa-folder-open text-4xl mb-2"></i>
            <p>目前沒有資料</p>
          </div>
        </div>

        <div id="mobileList" class="md:hidden space-y-3 pb-20"></div>

      </div>
    </div>
  </div>

  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <div id="modal" class="fixed inset-0 z-40 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm transition-opacity opacity-0" id="modalBackdrop"></div>
    <div class="fixed inset-0 z-10 overflow-y-auto">
      <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
        <div class="relative transform overflow-hidden rounded-lg bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-2xl opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" id="modalPanel">
          <div class="bg-white px-4 pb-4 pt-5 sm:p-6 sm:pb-4">
            <div class="sm:flex sm:items-start">
              <div class="mt-3 text-center sm:ml-4 sm:mt-0 sm:text-left w-full">
                <h3 class="text-xl font-bold leading-6 text-slate-900" id="modalTitle">預覽</h3>
                <div class="mt-4 max-h-[60vh] overflow-y-auto custom-scroll p-4 bg-slate-50 rounded-lg text-sm text-slate-600 leading-relaxed" id="modalContent"></div>
              </div>
            </div>
          </div>
          <div class="bg-slate-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6 gap-2">
            <button id="modalActionBtn" type="button" class="inline-flex w-full justify-center rounded-md bg-brand-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-brand-500 sm:w-auto gap-2 items-center">
              <i class="fa-regular fa-share-from-square"></i> 匯出
            </button>
            <button id="modalCopyBtn" type="button" class="hidden sm:inline-flex w-full justify-center rounded-md bg-emerald-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-emerald-500 sm:w-auto gap-2 items-center">
              <i class="fa-regular fa-copy"></i> 複製文字
            </button>
            <button id="modalCloseBtn" type="button" class="mt-3 inline-flex w-full justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 hover:bg-slate-50 sm:mt-0 sm:w-auto">關閉</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="historyModal" class="fixed inset-0 z-40 hidden">
    <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm" onclick="UI.closeHistory()"></div>
    <div class="fixed inset-0 z-10 overflow-y-auto pointer-events-none">
      <div class="flex min-h-full items-center justify-center p-4">
        <div class="pointer-events-auto relative bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[80vh] flex flex-col">
          <div class="p-4 border-b flex justify-between items-center">
            <h3 class="text-lg font-bold text-slate-800"><i class="fa-solid fa-clock-rotate-left"></i> 歷史紀錄 (最近 50 筆)</h3>
            <button onclick="UI.closeHistory()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
          </div>
          <div class="p-0 overflow-y-auto custom-scroll flex-1 bg-slate-50" id="historyList"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const CONFIG = {
      // 👇 請務必替換為您剛剛部署成功的新網址
      API_URL: "https://script.google.com/macros/s/AKfycbxSdY8W_u6cchXy9H9cTWzqw_OhBAOT8K4y2YmtTmpWl4XXkz6xoGccugepSpqBSsBr/exec",
      AWARD_LIMIT: 12
    };

    const Utils = {
      uuid: () => crypto.randomUUID().split('-')[0],
      formatDate: (d) => {
        if(!d) return '';
        const date = new Date(d);
        return isNaN(date) ? d : date.toISOString().split('T')[0];
      },
      getRankWeight: (rankStr) => {
        if (!rankStr) return 999;
        const map = { '金':10, '銀':20, '銅':30, '特優':40, '優等':50, '甲':60, '佳':70, '第一':1, '第二':2, '第三':3 };
        for (let k in map) if (rankStr.includes(k)) return map[k];
        return 100;
      }
    };

    const State = {
      rows: [],
      history: [],
      init() {},
      add(row) {
        this.rows.unshift({ ...row, id: Utils.uuid(), checked: true });
        this.save();
      },
      remove(id) {
        this.rows = this.rows.filter(r => r.id !== id);
        this.save();
      },
      clear() {
        this.rows = [];
        this.save();
      },
      save() {
        UI.renderList();
      },
      toggleCheck(id, status) {
        const r = this.rows.find(x => x.id === id);
        if(r) r.checked = status;
      },
      getChecked() {
        return this.rows.filter(r => r.checked);
      }
    };

    const API = {
      async post(payload) {
        try {
          const params = new URLSearchParams();
          for (const key in payload) {
            const val = typeof payload[key] === 'object' ? JSON.stringify(payload[key]) : payload[key];
            params.append(key, val);
          }
          const res = await fetch(CONFIG.API_URL, {
            method: 'POST',
            body: params,
            mode: 'cors'
          });
          const json = await res.json();
          return json;
        } catch (e) {
          throw new Error('網路連線失敗');
        }
      },
      async ping() { return this.post({ action: 'ping' }); },
      async getStudentName(cls, seat) { return this.post({ action: 'get_student_name', class: cls, seat: seat }); },
      async getHistory() { return this.post({ action: 'get_history' }); },
      async addRecordDB(record) {
        this.post({ action: 'add_record', ...record }).then(res => {
          if(res.status !== 'success') UI.toast('寫入資料庫失敗', 'error');
        });
      },
      async createEmcee(text) { return this.post({ action: 'create_emcee_doc', text }); },
      async createAward(rows) { return this.post({ action: 'create_award_doc', rows }); }
    };

    const UI = {
      els: {},
      init() {
        ['inClass','inSeat','inName','inDate','inReason','inRank','inReward','btnAdd',
         'tableBody','mobileList','q','btnEmcee','btnAward','btnClear','statusBadge',
         'modal','modalTitle','modalContent','modalCloseBtn','modalActionBtn','modalCopyBtn',
         'historyModal','historyList','nameLoading','checkAll','toastContainer'
        ].forEach(id => this.els[id] = document.getElementById(id));

        this.els.btnAdd.onclick = () => this.handleAdd();
        this.els.btnClear.onclick = () => { if(confirm('確定清空？')) State.clear(); };
        this.els.inClass.onblur = this.els.inSeat.onblur = () => this.handleAutoName();
        this.els.q.oninput = () => this.renderList();
        this.els.btnEmcee.onclick = () => this.handleEmceePreview();
        this.els.btnAward.onclick = () => this.handleAwardPreview();
        this.els.modalCloseBtn.onclick = () => this.closeModal();
        this.els.checkAll.onchange = (e) => {
             State.rows.forEach(r => r.checked = e.target.checked);
             this.renderList();
        };
        this.els.inDate.valueAsDate = new Date();
        const handleEnter = (e) => { if(e.key === 'Enter') this.handleAdd(); };
        this.els.inReward.addEventListener('keydown', handleEnter);
        this.els.inRank.addEventListener('keydown', handleEnter);
        this.checkConnection();
        this.renderList();
      },

      checkConnection() {
        const badge = this.els.statusBadge;
        API.ping().then(res => {
          if (res.status === 'success') {
            badge.className = 'inline-flex items-center gap-2 px-4 py-2 bg-emerald-100 text-emerald-700 rounded-full text-sm font-bold';
            badge.innerHTML = '<i class="fa-solid fa-wifi"></i> 連線正常';
          } else { throw new Error(); }
        }).catch(() => {
          badge.className = 'inline-flex items-center gap-2 px-4 py-2 bg-rose-100 text-rose-700 rounded-full text-sm font-bold';
          badge.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> 連線異常';
        });
      },

      async handleAutoName() {
        const c = this.els.inClass.value.trim();
        const s = this.els.inSeat.value.trim();
        if (!c || !s) return;

        this.els.nameLoading.classList.remove('hidden');
        try {
          const res = await API.getStudentName(c, s);
          if (res.status === 'success' && res.data.name) {
            this.els.inName.value = res.data.name;
            this.toast(`找到學生：${res.data.name}`, 'success');
          } else {
            this.toast(`查無此人 (班級:${c} 座號:${s})`, 'error');
          }
        } catch (e) { console.error(e); this.toast('查詢錯誤，請檢查連線', 'error'); }
        this.els.nameLoading.classList.add('hidden');
      },

      handleAdd() {
        const vals = {
          班級: this.els.inClass.value.trim(),
          座號: this.els.inSeat.value.trim(),
          姓名: this.els.inName.value.trim(),
          發生日期: this.els.inDate.value,
          事由: this.els.inReason.value.trim(),
          成績: this.els.inRank.value.trim(),
          獎懲種類: this.els.inReward.value
        };

        if (!vals.班級 || !vals.座號 || !vals.姓名) return this.toast('請完整填寫班級、座號與姓名', 'error');

        State.add(vals);
        API.addRecordDB(vals);
        
        // 貼心功能：保留班級，只清空其他
        this.els.inSeat.value = ''; this.els.inName.value = '';
        this.els.inReason.value = ''; this.els.inRank.value = '';
        this.toast('已加入清單', 'success');
        this.els.inSeat.focus();
      },

      renderList() {
        const q = this.els.q.value.toLowerCase();
        const filtered = State.rows.filter(r => (r.班級+r.姓名+r.事由).toLowerCase().includes(q));

        this.els.tableBody.innerHTML = filtered.map(r => `
          <tr class="hover:bg-slate-50 transition-colors group">
            <td class="px-4 py-3 text-center"><input type="checkbox" ${r.checked?'checked':''} onchange="State.toggleCheck('${r.id}', this.checked)" class="rounded text-brand-600"></td>
            <td class="px-4 py-3 font-medium text-slate-900">${r.班級}-${r.座號}</td>
            <td class="px-4 py-3">${r.姓名}</td>
            <td class="px-4 py-3 text-slate-500 max-w-xs truncate" title="${r.事由}">${r.事由}</td>
            <td class="px-4 py-3"><span class="px-2 py-1 bg-slate-100 text-slate-600 rounded text-xs">${r.成績||'-'}</span></td>
            <td class="px-4 py-3"><button onclick="State.remove('${r.id}')" class="text-slate-400 hover:text-rose-500"><i class="fa-solid fa-trash"></i></button></td>
          </tr>
        `).join('');

        this.els.mobileList.innerHTML = filtered.map(r => `
          <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex gap-4 items-start relative">
             <div class="absolute top-4 right-4"><button onclick="State.remove('${r.id}')" class="text-slate-300 hover:text-rose-500"><i class="fa-solid fa-trash"></i></button></div>
             <div class="flex items-center justify-center pt-1"><input type="checkbox" ${r.checked?'checked':''} onchange="State.toggleCheck('${r.id}', this.checked)" class="w-5 h-5 rounded text-brand-600"></div>
             <div class="flex-1 space-y-1">
               <div class="flex items-baseline gap-2"><span class="text-lg font-bold text-slate-900">${r.班級} <span class="text-sm font-normal text-slate-500">(${r.座號})</span></span><span class="text-lg font-bold text-slate-900">${r.姓名}</span></div>
               <div class="text-slate-600 text-sm leading-relaxed">${r.事由}</div>
               <div class="flex gap-2 mt-2">${r.成績 ? `<span class="inline-block px-2 py-1 bg-brand-50 text-brand-600 text-xs rounded-md">${r.成績}</span>` : ''}${r.獎懲種類 ? `<span class="inline-block px-2 py-1 bg-emerald-50 text-emerald-600 text-xs rounded-md">${r.獎懲種類}</span>` : ''}</div>
             </div>
          </div>
        `).join('');
        
        const isEmpty = filtered.length === 0;
        document.getElementById('emptyState').classList.toggle('hidden', !isEmpty);
      },

      handleEmceePreview() {
        const sel = State.getChecked();
        if(!sel.length) return this.toast('請至少勾選一筆資料', 'error');
        const grouped = {};
        sel.forEach(r => { if(!grouped[r.事由]) grouped[r.事由] = []; grouped[r.事由].push(r); });
        
        let text = '';
        for(let reason in grouped) {
          const list = grouped[reason].sort((a,b) => Utils.getRankWeight(a.成績) - Utils.getRankWeight(b.成績));
          const names = list.map(x => `${x.班級}班 ${x.姓名}${x.成績 ? ' 榮獲'+x.成績 : ''}`).join('、');
          text += `${reason}：\n${names}。\n恭請校長頒獎。\n\n`;
        }
        this.openModal('司儀稿預覽', text.replace(/\n/g, '<br>'), async () => {
           const res = await API.createEmcee(text);
           if(res.status === 'success') { window.open(res.data.docUrl, '_blank'); this.toast('司儀稿已建立', 'success'); }
        }, text);
      },

      handleAwardPreview() {
        const sel = State.getChecked();
        if(!sel.length) return this.toast('請至少勾選一筆資料', 'error');
        const previewHtml = sel.slice(0, CONFIG.AWARD_LIMIT).map(r => `<div class="border-b py-2 flex justify-between"><span>${r.班級}-${r.座號} ${r.姓名}</span> <span class="text-slate-500">${r.獎懲種類}</span></div>`).join('');
        const msg = sel.length > CONFIG.AWARD_LIMIT ? `<p class="text-rose-500 font-bold mb-2">注意：目前選取 ${sel.length} 筆，但系統每次上限為 ${CONFIG.AWARD_LIMIT} 筆。</p>` : '';

        this.openModal('獎懲單預覽', msg + previewHtml, async () => {
           const res = await API.createAward(sel);
           if(res.status === 'success') { window.open(res.data.pdfUrl, '_blank'); this.toast('獎懲單已建立', 'success'); }
        });
      },

      openModal(title, htmlContent, actionCallback, rawText = null) {
        this.els.modalTitle.textContent = title;
        this.els.modalContent.innerHTML = htmlContent;
        this.els.modal.classList.remove('hidden');
        requestAnimationFrame(() => {
          document.getElementById('modalBackdrop').classList.remove('opacity-0');
          document.getElementById('modalPanel').classList.remove('opacity-0', 'translate-y-4', 'sm:translate-y-0', 'sm:scale-95');
        });

        const btn = this.els.modalActionBtn;
        btn.onclick = async () => {
          btn.disabled = true; 
          const originalContent = btn.innerHTML;
          btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 處理中...';
          try { await actionCallback(); } 
          catch(e){ UI.toast('執行過程發生異常，但文件可能已產出','error'); console.error(e); } 
          finally { btn.disabled = false; btn.innerHTML = originalContent; }
        };

        const copyBtn = this.els.modalCopyBtn;
        if(rawText) {
          copyBtn.classList.remove('hidden');
          copyBtn.onclick = () => { navigator.clipboard.writeText(rawText); UI.toast('已複製文字','success'); };
        } else { copyBtn.classList.add('hidden'); }
      },

      closeModal() {
         document.getElementById('modalBackdrop').classList.add('opacity-0');
         document.getElementById('modalPanel').classList.add('opacity-0', 'translate-y-4', 'sm:translate-y-0', 'sm:scale-95');
         setTimeout(() => this.els.modal.classList.add('hidden'), 200);
      },

      async openHistory() {
        this.els.historyModal.classList.remove('hidden');
        this.els.historyList.innerHTML = '<div class="p-8 text-center text-slate-500"><i class="fa-solid fa-spinner fa-spin text-2xl"></i><br>載入中...</div>';
        try {
          const res = await API.getHistory();
          if(res.status === 'success') { State.history = res.data.records; this.renderHistoryList(); }
        } catch(e) { this.els.historyList.innerHTML = '<div class="p-8 text-center text-rose-500">載入失敗</div>'; }
      },
      
      renderHistoryList() {
        if(!State.history.length) { this.els.historyList.innerHTML = '<div class="p-8 text-center text-slate-400">尚無歷史紀錄</div>'; return; }
        this.els.historyList.innerHTML = State.history.map(r => `
          <div class="flex flex-col md:flex-row items-start md:items-center justify-between p-4 border-b border-slate-100 hover:bg-slate-50 gap-4">
             <div class="flex-1">
               <div class="flex gap-2 items-baseline font-bold text-slate-800"><span>${r.班級}-${r.座號}</span><span>${r.姓名}</span><span class="text-xs font-normal text-slate-400 ml-2">${Utils.formatDate(r.發生日期)}</span></div>
               <div class="text-sm text-slate-600 mt-1">${r.事由} ${r.成績 ? `(${r.成績})` : ''}</div>
             </div>
             <button onclick='UI.copyHistory(${JSON.stringify(r)})' class="px-3 py-1.5 text-xs bg-white border border-brand-200 text-brand-600 rounded hover:bg-brand-50 transition-colors"><i class="fa-solid fa-reply"></i> 複製到清單</button>
          </div>
        `).join('');
      },

      copyHistory(r) {
        const newRow = { ...r, checked:true };
        State.add(newRow);
        this.closeHistory();
        this.toast(`已複製 ${r.姓名} 的紀錄`, 'success');
      },

      closeHistory() { this.els.historyModal.classList.add('hidden'); },

      toast(msg, type='info') {
        const div = document.createElement('div');
        const colors = type === 'success' ? 'bg-emerald-600' : (type === 'error' ? 'bg-rose-500' : 'bg-slate-700');
        const icon = type === 'success' ? 'check' : (type === 'error' ? 'triangle-exclamation' : 'info-circle');
        
        div.className = `${colors} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 text-sm font-medium transform transition-all duration-300 translate-y-10 opacity-0`;
        div.innerHTML = `<i class="fa-solid fa-${icon}"></i> ${msg}`;
        
        let container = document.getElementById('toastContainer');
        if (!container) {
            console.warn('找不到 toastContainer，正在自動建立...');
            container = document.createElement('div');
            container.id = 'toastContainer';
            container.className = 'fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none';
            document.body.appendChild(container);
            if(this.els) this.els.toastContainer = container;
        }

        container.appendChild(div);
        
        requestAnimationFrame(() => div.classList.remove('translate-y-10', 'opacity-0'));
        
        setTimeout(() => {
          div.classList.add('translate-y-10', 'opacity-0');
          setTimeout(() => div.remove(), 300);
        }, 3000);
      }
    }; // ✅ 這裡已經完全正確

    document.addEventListener('DOMContentLoaded', () => UI.init());
  </script>
</body>
</html>
