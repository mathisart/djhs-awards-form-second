<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校園榮譽頒獎系統 (PRO版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1903/1903172.png">
  
  <script>
    // 👇👇👇 請將您的 GAS 部署網址 (以 /exec 結尾) 貼在這裡 👇👇👇
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzS9bVUV0LmQNDjnEaR2OiN-8gDqE3uOTh-VAidyx13902r9P5Zbab0RgoDxnyMC-UKQQ/exec";
  </script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } } } }
    }
  </script>
  <style>
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

  <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
    <header class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-school text-brand-600"></i>
          校園榮譽頒獎系統 <span class="text-xs bg-brand-100 text-brand-700 px-2 py-1 rounded-full">Web v4.8</span>
        </h1>
        <a id="dbLink" href="#" target="_blank" class="hidden text-xs text-brand-600 hover:underline ml-2">
          <i class="fa-solid fa-database"></i> 資料庫
        </a>
      </div>
      <div id="statusBadge" class="inline-flex items-center gap-2 px-4 py-2 bg-slate-200 rounded-full text-sm font-medium text-slate-600 cursor-pointer select-none">
        <i class="fa-solid fa-circle-notch fa-spin"></i> 連線中...
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <div class="lg:col-span-4 space-y-6">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 sticky top-4">
          <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2 flex items-center gap-2">
            <i class="fa-solid fa-user-pen text-brand-500"></i> 新增名單
          </h2>
          <div class="space-y-4">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">班級</label>
                <input id="inClass" type="text" placeholder="701" class="w-full rounded-lg border-slate-300 focus:border-brand-500 focus:ring-brand-500 p-2.5 bg-slate-50 text-center text-lg font-bold">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">座號</label>
                <input id="inSeat" type="text" placeholder="01" class="w-full rounded-lg border-slate-300 focus:border-brand-500 focus:ring-brand-500 p-2.5 bg-slate-50 text-center text-lg font-bold">
              </div>
            </div>
            <div class="relative">
              <label class="block text-xs font-semibold text-slate-500 mb-1">姓名</label>
              <input id="inName" type="text" placeholder="自動查詢..." class="w-full rounded-lg border-slate-300 focus:border-brand-500 p-2.5">
              <div id="nameLoading" class="absolute right-3 top-8 hidden text-slate-400"><i class="fa-solid fa-spinner fa-spin"></i></div>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">發生日期</label>
              <input id="inDate" type="date" class="w-full rounded-lg border-slate-300 focus:border-brand-500 p-2.5 text-slate-600">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">事由</label>
              <textarea id="inReason" rows="2" placeholder="例如：校內英語朗讀比賽" class="w-full rounded-lg border-slate-300 focus:border-brand-500 p-2.5"></textarea>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">成績</label>
              <input id="inRank" type="text" placeholder="例如：第一名" class="w-full rounded-lg border-slate-300 focus:border-brand-500 p-2.5">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">建議敘獎</label>
              <select id="inReward" class="w-full rounded-lg border-slate-300 focus:border-brand-500 p-2.5">
                <option value="">(無)</option>
                <option value="嘉獎一支">嘉獎一支</option>
                <option value="嘉獎二支">嘉獎二支</option>
                <option value="小功一支">小功一支</option>
                <option value="小功二支">小功二支</option>
              </select>
            </div>
            <button id="btnAdd" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-lg shadow mt-2">加入清單</button>
          </div>
        </div>
      </div>

      <div class="lg:col-span-8 space-y-4">
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-3 items-center justify-between">
          <div class="flex gap-2">
            <button onclick="UI.openHistory()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-medium">歷史紀錄</button>
            <button id="btnClear" class="px-4 py-2 text-rose-600 hover:bg-rose-50 rounded-lg font-medium"><i class="fa-regular fa-trash-can"></i> 清空</button>
          </div>
          <div class="flex gap-2 w-full sm:w-auto">
            <button id="btnEmcee" class="flex-1 sm:flex-none px-4 py-2 bg-violet-600 hover:bg-violet-700 text-white rounded-lg font-medium shadow-sm">司儀稿</button>
            <button id="btnAward" class="flex-1 sm:flex-none px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-medium shadow-sm">敘獎單</button>
          </div>
        </div>
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
          <input id="q" type="text" placeholder="搜尋..." class="w-full pl-10 pr-4 py-2.5 rounded-lg border-slate-200 border shadow-sm focus:border-brand-500">
        </div>
        <div class="hidden md:block bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="overflow-x-auto max-h-[600px] custom-scroll">
            <table class="w-full text-sm text-left text-slate-600">
              <thead class="text-xs text-slate-700 uppercase bg-slate-50 sticky top-0 border-b z-10">
                <tr>
                  <th class="px-4 py-3 w-10 text-center"><input type="checkbox" id="checkAll" class="rounded"></th>
                  <th class="px-4 py-3">班級/座號</th>
                  <th class="px-4 py-3">姓名</th>
                  <th class="px-4 py-3">事由</th>
                  <th class="px-4 py-3">成績</th>
                  <th class="px-4 py-3">操作</th>
                </tr>
              </thead>
              <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>
          <div id="emptyState" class="hidden py-12 flex flex-col items-center justify-center text-slate-400">
            <i class="fa-regular fa-folder-open text-4xl mb-2"></i><p>無資料</p>
          </div>
        </div>
        <div id="mobileList" class="md:hidden space-y-3 pb-20"></div>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <div id="modal" class="fixed inset-0 z-40 hidden">
    <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm" id="modalBackdrop"></div>
    <div class="fixed inset-0 z-10 overflow-y-auto">
        <div class="flex min-h-full items-end justify-center p-4 sm:items-center sm:p-0">
            <div class="relative bg-white rounded-lg shadow-xl sm:w-full sm:max-w-3xl" id="modalPanel">
                <div class="bg-white px-4 pb-4 pt-5 sm:p-6">
                    <h3 class="text-xl font-bold text-slate-900" id="modalTitle">預覽</h3>
                    <div class="mt-4 max-h-[60vh] overflow-y-auto custom-scroll p-4 bg-slate-50 rounded-lg text-sm text-slate-600" id="modalContent"></div>
                </div>
                <div id="modalFooter" class="bg-slate-50 px-4 py-3 sm:flex sm:flex-row sm:justify-end sm:px-6 gap-2 flex-wrap items-center"></div>
            </div>
        </div>
    </div>
  </div>

  <div id="historyModal" class="fixed inset-0 z-40 hidden">
      <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm" onclick="UI.closeHistory()"></div>
      <div class="fixed inset-0 z-10 overflow-y-auto pointer-events-none">
          <div class="flex min-h-full items-center justify-center p-4">
              <div class="pointer-events-auto relative bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[80vh] flex flex-col">
                  <div class="p-4 border-b bg-white rounded-t-xl sticky top-0 z-20">
                      <div class="flex justify-between items-center mb-3">
                          <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                              <i class="fa-solid fa-clock-rotate-left text-brand-600"></i> 歷史紀錄
                          </h3>
                          <button onclick="UI.closeHistory()"><i class="fa-solid fa-xmark text-xl text-slate-400 hover:text-slate-600"></i></button>
                      </div>
                      <div class="relative">
                          <i class="fa-solid fa-search absolute left-3 top-2.5 text-slate-400"></i>
                          <input id="histSearch" type="text" placeholder="搜尋歷史紀錄 (姓名、班級、事由)..." class="w-full pl-9 pr-4 py-2 border border-slate-200 rounded-lg bg-slate-50 focus:bg-white focus:border-brand-500 outline-none text-sm transition-all">
                      </div>
                  </div>

                  <div class="p-0 overflow-y-auto custom-scroll flex-1 bg-slate-50" id="historyList"></div>
                  
                  <div id="historyPagination" class="p-3 border-t bg-white flex flex-col sm:flex-row justify-between items-center text-sm text-slate-600 gap-3 hidden">
                      <div class="flex gap-2">
                          <button id="histPrev" class="px-3 py-1.5 bg-slate-100 rounded hover:bg-slate-200 disabled:opacity-50"><i class="fa-solid fa-chevron-left"></i></button>
                          <span id="histInfo" class="px-2 py-1.5 bg-slate-50 rounded">頁碼</span>
                          <button id="histNext" class="px-3 py-1.5 bg-slate-100 rounded hover:bg-slate-200 disabled:opacity-50"><i class="fa-solid fa-chevron-right"></i></button>
                      </div>
                      <button id="histBatchBtn" class="w-full sm:w-auto px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg font-medium shadow-sm flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                          <i class="fa-solid fa-reply-all"></i> 複製選取項目 (<span id="histBatchCount">0</span>)
                      </button>
                  </div>
              </div>
          </div>
      </div>
  </div>

  <script>
    const Utils = { uuid:()=>crypto.randomUUID().split('-')[0], formatDate:(d)=>{if(!d)return'';const date=new Date(d);return isNaN(date)?d:date.toISOString().split('T')[0]}, getRankWeight:(r)=>{if(!r)return 999;const m={'金':10,'銀':20,'銅':30,'特優':40,'優等':50,'甲':60,'佳':70,'第一':1,'第二':2,'第三':3};for(let k in m)if(r.includes(k))return m[k];return 100} };
    const State = { 
        rows:[], history:[], historyPage: 1, itemsPerPage: 10, histSearchQuery: '',
        add(r){this.rows.unshift({...r,id:Utils.uuid(),checked:true});UI.renderList()}, 
        remove(id){this.rows=this.rows.filter(r=>r.id!==id);UI.renderList()}, 
        clear(){this.rows=[];UI.renderList()}, 
        toggleCheck(id,s){const r=this.rows.find(x=>x.id===id);if(r)r.checked=s}, 
        getChecked(){return this.rows.filter(r=>r.checked)} 
    };
    
    const API = {
      async post(payload) {
        const formData = new URLSearchParams();
        for(const k in payload) formData.append(k, typeof payload[k]==='object'?JSON.stringify(payload[k]):payload[k]);
        const res = await fetch(GAS_URL, { method:'POST', body:formData });
        return await res.json();
      },
      async ping(){return this.post({action:'ping'})},
      async getStudentName(c,s){return this.post({action:'get_student_name',class:c,seat:s})},
      async getHistory(){return this.post({action:'get_history'})},
      async addRecordDB(r){this.post({action:'add_record',...r}).catch(e=>UI.toast('寫入失敗','error'))},
      async createEmcee(rows){ return this.post({action:'create_emcee_doc', rows: rows}) },      async createAward(r){return this.post({action:'create_award_doc',rows:r})},
      async getSheetUrl(){return this.post({action:'get_sheet_url'})}
    };

    const UI = {
      els: {},
      init() {
        ['inClass','inSeat','inName','inDate','inReason','inRank','inReward','btnAdd','tableBody','mobileList','q','btnEmcee','btnAward','btnClear','statusBadge','modal','modalTitle','modalContent','modalFooter','historyModal','historyList','historyPagination','histPrev','histNext','histInfo','histSearch','histBatchBtn','histBatchCount','nameLoading','checkAll','dbLink'].forEach(id=>this.els[id]=document.getElementById(id));
        this.els.btnAdd.onclick=()=>this.handleAdd();
        this.els.btnClear.onclick=()=>{if(confirm('清空？'))State.clear()};
        this.els.inClass.onblur=this.els.inSeat.onblur=()=>this.handleAutoName();
        this.els.q.oninput=()=>this.renderList();
        this.els.btnEmcee.onclick=()=>this.handleEmceePreview();
        this.els.btnAward.onclick=()=>this.handleAwardPreview();
        this.els.checkAll.onchange=(e)=>{State.rows.forEach(r=>r.checked=e.target.checked);this.renderList()};
        
        this.els.histPrev.onclick=()=>{if(State.historyPage>1){State.historyPage--;this.renderHistoryList()}};
        this.els.histNext.onclick=()=>{
            const filtered = this.getFilteredHistory();
            if(State.historyPage*State.itemsPerPage < filtered.length){State.historyPage++;this.renderHistoryList()}
        };
        this.els.histSearch.oninput=(e)=>{ State.histSearchQuery=e.target.value.toLowerCase(); State.historyPage=1; this.renderHistoryList(); };
        this.els.histBatchBtn.onclick=()=>this.batchCopyHistory();

        this.els.inDate.valueAsDate=new Date();
        this.checkConnection(); this.renderList();
      },
      checkConnection(){
        API.ping().then(()=>{
          this.els.statusBadge.innerHTML='<i class="fa-solid fa-wifi"></i> 連線正常';
          this.els.statusBadge.className='inline-flex items-center gap-2 px-4 py-2 bg-emerald-100 text-emerald-700 rounded-full text-sm font-bold';
          API.getSheetUrl().then(res=>{ if(res.data && res.data.url){ this.els.dbLink.href=res.data.url; this.els.dbLink.classList.remove('hidden'); } });
        }).catch(()=>{
          this.els.statusBadge.innerHTML='<i class="fa-solid fa-triangle-exclamation"></i> 連線失敗';
          this.els.statusBadge.className='inline-flex items-center gap-2 px-4 py-2 bg-rose-100 text-rose-700 rounded-full text-sm font-bold';
        });
      },
      async handleAutoName(){
        const c=this.els.inClass.value.trim(), s=this.els.inSeat.value.trim();
        if(!c||!s)return;
        this.els.nameLoading.classList.remove('hidden');
        try{const res=await API.getStudentName(c,s);if(res.status==='success'&&res.data.name){this.els.inName.value=res.data.name;this.toast(`找到：${res.data.name}`,'success')}else{this.toast('查無此人','error')}}catch(e){this.toast('查詢錯誤','error')}
        this.els.nameLoading.classList.add('hidden');
      },
      handleAdd(){
        const v={班級:this.els.inClass.value,座號:this.els.inSeat.value,姓名:this.els.inName.value,發生日期:this.els.inDate.value,事由:this.els.inReason.value,成績:this.els.inRank.value,獎懲種類:this.els.inReward.value};
        if(!v.班級||!v.座號||!v.姓名)return this.toast('請填寫完整','error');
        if(State.rows.some(r=>r.班級==v.班級&&r.座號==v.座號&&r.事由==v.事由))return this.toast('重複警告','error');
        State.add(v);API.addRecordDB(v);
        this.els.inSeat.value='';this.els.inName.value='';this.els.inReason.value='';this.els.inRank.value='';this.toast('已加入','success');this.els.inSeat.focus();
      },
      renderList(){
        const q=this.els.q.value.toLowerCase(), f=State.rows.filter(r=>(r.班級+r.姓名+r.事由).toLowerCase().includes(q));
        this.els.tableBody.innerHTML=f.map(r=>`<tr class="hover:bg-slate-50"><td class="px-4 py-3 text-center"><input type="checkbox" ${r.checked?'checked':''} onchange="State.toggleCheck('${r.id}',this.checked)" class="rounded"></td><td class="px-4 py-3 font-bold">${r.班級}-${r.座號}</td><td class="px-4 py-3">${r.姓名}</td><td class="px-4 py-3 truncate max-w-xs text-slate-500">${r.事由}</td><td class="px-4 py-3"><span class="bg-slate-100 px-2 py-1 rounded text-xs">${r.成績||'-'}</span></td><td class="px-4 py-3"><button onclick="State.remove('${r.id}')" class="text-slate-300 hover:text-rose-500"><i class="fa-solid fa-trash"></i></button></td></tr>`).join('');
        this.els.mobileList.innerHTML=f.map(r=>`<div class="bg-white p-4 rounded shadow border flex gap-3 relative"><button onclick="State.remove('${r.id}')" class="absolute top-3 right-3 text-slate-300 hover:text-rose-500"><i class="fa-solid fa-trash"></i></button><div class="pt-1"><input type="checkbox" ${r.checked?'checked':''} onchange="State.toggleCheck('${r.id}',this.checked)" class="w-5 h-5"></div><div><div class="font-bold text-lg">${r.班級} (${r.座號}) ${r.姓名}</div><div class="text-slate-600">${r.事由}</div><div class="flex gap-2 mt-1"><span class="bg-blue-50 text-blue-600 text-xs px-2 py-1 rounded">${r.成績||''}</span><span class="bg-green-50 text-green-600 text-xs px-2 py-1 rounded">${r.獎懲種類||''}</span></div></div></div>`).join('');
        document.getElementById('emptyState').classList.toggle('hidden',f.length!==0);
      },

      handleEmceePreview() {
        const sel = State.getChecked();
        if(!sel.length) return this.toast('請至少勾選一筆','error');
        
        // 這裡依然產生文字，僅供「預覽」和「複製」使用
        const grp={}; sel.forEach(r=>{if(!grp[r.事由])grp[r.事由]=[];grp[r.事由].push(r)});
        let text = '';
        for(let k in grp) {
            const list = grp[k].sort((a,b)=>Utils.getRankWeight(a.成績)-Utils.getRankWeight(b.成績));
            const names = list.map(x => { const awardText = x.成績 ? ` 榮獲 ${x.成績}` : ''; return `${x.班級} ${x.姓名}${awardText}`; }).join('、');
            text += `${k}：\n${names}。\n恭請校長頒獎。\n\n`;
        }
        
        this.openModal('司儀稿預覽', text.replace(/\n/g,'<br>'));
        
        // 👇 修改重點：executeAndOpen 的第三個參數，改傳 `sel` (原始陣列)，而不是 `text`
        this.renderButtons([
            { label: '複製文字', click: () => { navigator.clipboard.writeText(text); this.toast('已複製文字','success'); }, icon: 'copy', color: 'green' },
            { 
              label: '建立並開啟 Google 文件', 
              icon: 'file-word', 
              color: 'blue', 
              click: (btn) => this.executeAndOpen('emcee', 'doc', sel, btn) // 👈 這裡改成 sel
            },
            { 
              label: '建立並開啟 PDF', 
              icon: 'file-pdf', 
              color: 'red', 
              click: (btn) => this.executeAndOpen('emcee', 'pdf', sel, btn) // 👈 這裡改成 sel
            }
        ]);
      },

      handleAwardPreview() {
        const sel = State.getChecked();
        if(!sel.length) return this.toast('請至少勾選一筆','error');
        const text = sel.map(r=>`${r.班級}-${r.座號} ${r.姓名} (${r.獎懲種類})`).join('<br>');
        this.openModal('敘獎單預覽', text);
        this.renderButtons([
            { label: '建立並開啟試算表', icon: 'file-excel', color: 'emerald', click: (btn) => this.executeAndOpen('award', 'doc', sel, btn) },
            { label: '建立並開啟 PDF', icon: 'file-pdf', color: 'red', click: (btn) => this.executeAndOpen('award', 'pdf', sel, btn) }
        ]);
      },

      executeAndOpen(type, format, data, btnElement) {
         const originalText = btnElement.innerHTML;
         btnElement.disabled = true;
         btnElement.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> 處理中...`;
         const apiCall = type === 'emcee' ? API.createEmcee(data) : API.createAward(data);
         apiCall.then(res => {
             if(res.status === 'success') {
                 const url = format === 'pdf' ? res.data.pdfUrl : res.data.docUrl;
                 window.open(url, '_blank');
                 this.toast('檔案已開啟', 'success');
             } else { this.toast('建立失敗: ' + res.message, 'error'); }
         }).catch(e => { this.toast('系統錯誤', 'error'); }).finally(() => { btnElement.disabled = false; btnElement.innerHTML = originalText; });
      },

      openModal(title, htmlContent) {
        this.els.modalTitle.textContent = title;
        this.els.modalContent.innerHTML = htmlContent;
        this.els.modal.classList.remove('hidden');
      },

      renderButtons(buttons) {
        this.els.modalFooter.innerHTML = ''; 
        buttons.forEach(cfg => {
            const btn = document.createElement('button');
            let colorClass = 'bg-slate-600 hover:bg-slate-700';
            if(cfg.color === 'red') colorClass = 'bg-rose-600 hover:bg-rose-700';
            else if(cfg.color === 'green') colorClass = 'bg-green-600 hover:bg-green-700';
            else if(cfg.color === 'emerald') colorClass = 'bg-emerald-600 hover:bg-emerald-700';
            else if(cfg.color === 'blue') colorClass = 'bg-blue-600 hover:bg-blue-700';
            btn.className = `inline-flex w-full sm:w-auto justify-center rounded-md ${colorClass} px-3 py-2 text-sm font-semibold text-white shadow-sm gap-2 items-center`;
            btn.innerHTML = `<i class="fa-solid fa-${cfg.icon}"></i> ${cfg.label}`;
            if (cfg.click) btn.onclick = () => cfg.click(btn); else btn.onclick = () => window.open(cfg.url, '_blank');
            this.els.modalFooter.appendChild(btn);
        });
        const closeBtn = document.createElement('button');
        closeBtn.className = "inline-flex w-full sm:w-auto justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 hover:bg-slate-50";
        closeBtn.textContent = "關閉";
        closeBtn.onclick = () => this.els.modal.classList.add('hidden');
        this.els.modalFooter.appendChild(closeBtn);
      },

      async openHistory(){
         this.els.historyModal.classList.remove('hidden'); 
         this.els.historyList.innerHTML='<div class="p-8 text-center text-slate-500"><i class="fa-solid fa-spinner fa-spin"></i> 載入中...</div>';
         this.els.historyPagination.classList.add('hidden');
         
         try{
             const res = await API.getHistory();
             // 🔥 關鍵修正：確保每一筆資料都有唯一 ID，避免勾選衝突
             // 若後端有傳回 編號 (id)，就使用編號，否則生成臨時 ID (避免舊資料沒 ID)
             State.history = res.data.records.map(r => ({
                 ...r, 
                 tempId: r['編號'] || Utils.uuid(), 
                 checked: false
             })); 
             
             State.historyPage = 1;
             this.renderHistoryList();
         } catch(e){
             this.els.historyList.innerHTML='<div class="p-8 text-center text-rose-500">載入失敗</div>';
         }
      },
      
      getFilteredHistory() {
          if(!State.histSearchQuery) return State.history;
          return State.history.filter(r => 
              (r.姓名+r.班級+r.事由).toLowerCase().includes(State.histSearchQuery)
          );
      },

      renderHistoryList() {
        const filtered = this.getFilteredHistory();
        if(!filtered.length) { 
            this.els.historyList.innerHTML = '<div class="p-8 text-center text-slate-400">查無資料</div>'; 
            this.els.historyPagination.classList.add('hidden');
            return; 
        }

        const start = (State.historyPage - 1) * State.itemsPerPage;
        const end = start + State.itemsPerPage;
        const pageData = filtered.slice(start, end);

        this.els.historyList.innerHTML = pageData.map((r) => {
            const isChecked = r.checked ? 'checked' : '';
            const rewardColor = r.獎懲種類.includes('嘉獎') ? 'text-emerald-600 bg-emerald-50' : (r.獎懲種類.includes('小功') ? 'text-orange-600 bg-orange-50' : 'text-slate-600 bg-slate-100');

            // 🔥 關鍵修正：使用 tempId 來做勾選，確保唯一性
            return `
            <div class="p-3 border-b border-slate-100 hover:bg-slate-50 flex items-center gap-3 transition-colors group">
                <input type="checkbox" ${isChecked} onchange="UI.toggleHistCheck('${r.tempId}', this.checked)" class="w-5 h-5 rounded text-brand-600 cursor-pointer">
                <div class="flex-1">
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-slate-800">${r.班級} ${r.姓名}</span>
                        <span class="text-xs px-2 py-0.5 rounded ${rewardColor}">${r.獎懲種類}</span>
                    </div>
                    <div class="text-sm text-slate-600 mt-0.5">${r.事由} ${r.成績 ? `(${r.成績})` : ''}</div>
                    <div class="text-xs text-slate-400 mt-0.5"><i class="fa-regular fa-clock"></i> ${Utils.formatDate(r.發生日期)}</div>
                </div>
                <button onclick='UI.copyHist(${JSON.stringify(r)})' class="px-3 py-1.5 text-xs bg-white border border-slate-200 text-slate-600 rounded hover:bg-brand-50 hover:text-brand-600 transition-colors">單筆複製</button>
            </div>`;
        }).join('');

        this.els.historyPagination.classList.remove('hidden');
        const totalPages = Math.ceil(filtered.length / State.itemsPerPage);
        this.els.histInfo.textContent = `第 ${State.historyPage} / ${totalPages} 頁`;
        this.els.histPrev.disabled = State.historyPage === 1;
        this.els.histNext.disabled = end >= filtered.length;
        this.updateBatchBtn();
      },

      // 🔥 關鍵修正：改用 ID 尋找
      toggleHistCheck(id, checked) {
          const target = State.history.find(r => r.tempId === id);
          if(target) target.checked = checked;
          this.updateBatchBtn();
      },

      updateBatchBtn() {
          const count = State.history.filter(r => r.checked).length;
          this.els.histBatchCount.textContent = count;
          this.els.histBatchBtn.disabled = count === 0;
          this.els.histBatchBtn.className = count > 0 
            ? "w-full sm:w-auto px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg font-medium shadow-sm flex items-center justify-center gap-2"
            : "w-full sm:w-auto px-4 py-2 bg-slate-300 text-white rounded-lg font-medium shadow-sm flex items-center justify-center gap-2 cursor-not-allowed";
      },

      batchCopyHistory() {
          const selected = State.history.filter(r => r.checked);
          if(selected.length === 0) return;
          selected.forEach(r => {
              const { checked, tempId, ...data } = r; 
              State.add({...data, checked: true});
          });
          this.els.historyModal.classList.add('hidden');
          this.toast(`已成功複製 ${selected.length} 筆資料`, 'success');
      },

      copyHist(r){ 
          const { checked, tempId, ...data } = r;
          State.add({...data, checked: true}); 
          this.els.historyModal.classList.add('hidden'); 
          this.toast('已複製','success'); 
      },
      
      closeHistory(){this.els.historyModal.classList.add('hidden')},
      toast(m,t){const d=document.createElement('div');d.className=`fixed bottom-5 right-5 px-4 py-3 rounded text-white shadow ${t==='success'?'bg-emerald-600':'bg-rose-500'}`;d.innerHTML=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}
    };
    
    window.UI = UI; 
    document.addEventListener('DOMContentLoaded',()=>UI.init());
  </script>
</body>
</html>
